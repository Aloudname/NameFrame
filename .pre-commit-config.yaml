repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format check
        entry: uv run --no-sync ruff format --check
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: pytest
        name: pytest
        entry: uv run --no-sync python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
