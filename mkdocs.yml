site_name: NameFrame Documentation
site_description: 面向个人研究项目的轻量 PyTorch 内核。
site_author: Aloudname
repo_url: https://github.com/Aloudname/NameFrame

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: switch_dark_mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: switch_light_mode
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - 首页: index.md
  - 维护与兼容: maintenance.md
  - API:
    - 基础: api/base.md
    - 配置: api/config.md
    - 组件: api/components.md
    - 数据管线: api/data.md
