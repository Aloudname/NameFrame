name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Create environment and install tools
        run: |
          uv venv --python 3.11
          uv run --no-sync python -c 'import tomllib; print(next(item for item in tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"] if item.startswith("ruff==")))' > /tmp/nameframe-quality.txt
          uv pip install -r /tmp/nameframe-quality.txt -r requirements-docs.txt
      - name: Lint, formatting and documentation
        run: |
          uv run --no-sync ruff check nameframe --output-format=github
          uv run --no-sync ruff format --check nameframe
          uv run --no-sync mkdocs build --strict

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            torch-spec: "torch==2.0.1"
            numpy-spec: "numpy==1.26.4"
          - python-version: "3.11"
            torch-spec: "torch==2.5.1"
            numpy-spec: "numpy==2.4.6"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Create environment and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install '${{ matrix.torch-spec }}' --index-url https://download.pytorch.org/whl/cpu
          uv pip install '${{ matrix.numpy-spec }}'
          uv pip install -e .
      - name: Build distributions
        run: uv build
      - name: Check distribution contents
        run: |
          uv run --no-sync python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = archive.namelist()
          unexpected = [
              name
              for name in wheel_names
              if not name.startswith("nameframe/") and ".dist-info/" not in name
          ]
          assert not unexpected, unexpected

          with tarfile.open(sdists[0]) as archive:
              sdist_names = archive.getnames()
          forbidden = {"tests", "tools", "examples"}
          leaked = [
              name
              for name in sdist_names
              if forbidden.intersection(name.split("/"))
          ]
          assert not leaked, leaked
          PY
      - name: Rebuild wheel from source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/nameframe-rebuilt"
          uv build --wheel --out-dir "$RUNNER_TEMP/nameframe-rebuilt" dist/nameframe-*.tar.gz
      - name: Install rebuilt wheel and import it
        run: |
          uv pip uninstall nameframe
          uv pip install --no-deps "$RUNNER_TEMP"/nameframe-rebuilt/*.whl
          mkdir -p "$RUNNER_TEMP/nameframe-smoke"
          cd "$RUNNER_TEMP/nameframe-smoke"
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'from importlib.metadata import version; from pathlib import Path; import nameframe; assert "site-packages" in Path(nameframe.__file__).parts; assert nameframe.__version__ == version("nameframe")'
